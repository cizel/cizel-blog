baseURL = "https://www.cizel.cn"
title = "阿臻说"
# zh-Hans 才能让 :date_medium 显示中文；站点语言键仍是 zh-cn
locale = "zh-Hans"
defaultContentLanguage = "zh-cn"
hasCJKLanguage = true
enableInlineShortcodes = true

theme = "paper"

[pagination]
  pagerSize = 20

[params]
  color = "linen"
  description = "爱编程，爱破解，爱写作 - 阿臻说"
  keywords = "Cizel, 阿臻说, 阿臻, 程序员成长"

  author = "阿臻"
  name = "阿臻"
  bio = "编程 / 安全 / 写作"
  # 以 / 开头的路径会在主题里转成绝对地址，对应 static/images/author.jpg
  avatar = "/images/author.jpg"

  github = "cizel"
  rss = true

  favicon = "favicon.ico"
  appleTouchIcon = "apple-touch-icon.png"

  # 首页和文末导航只收录 content/posts
  mainSections = ["posts"]

  footercontent = "东隅已逝，桑榆非晚"
  beian = "鄂ICP备16010857号-1"
  since = 2016

  [params.utterances]
    repo = "cizel/blog-comments"
    issueTerm = "title"
    label = "comment"
    theme = "github-light"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "博客"
    url = "/posts/"
    weight = 1
  [[menu.main]]
    identifier = "about"
    name = "关于"
    url = "/about/"
    weight = 5

[taxonomies]
  category = "categories"
  series = "series"
  tag = "tags"
  author = "authors"

# 允许正文里的原始 HTML，避免旧文章里的标签被 Goldmark 丢掉
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
